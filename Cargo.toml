[workspace]
resolver = "3"
members = [
  "contracts",
  "clients/gateway",
  "clients/native-player",
  "clients/app",
  "backend/contracts",
  "backend/infra",
  "backend/contexts/catalog/domain",
  "backend/contexts/catalog/features",
  "backend/contexts/offline/domain",
  "backend/contexts/offline/features",
  "backend/contexts/viewing/domain",
  "backend/contexts/viewing/features",
  "backend/runtime",
  "e2e",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/taitide-labs/hg"

[workspace.dependencies]
aes = { version = "0.9", default-features = false }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "getrandom"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
block2 = "0.6"
bytes = { version = "1", default-features = false, features = ["std"] }
cbc = { version = "0.2", default-features = false, features = ["alloc", "block-padding"] }
hg-backend-contracts = { path = "backend/contracts" }
hg-catalog-domain = { path = "backend/contexts/catalog/domain" }
hg-catalog-features = { path = "backend/contexts/catalog/features" }
hg-contracts = { path = "contracts" }
hg-gateway = { path = "clients/gateway" }
hg-infra = { path = "backend/infra" }
hg-native-player = { path = "clients/native-player" }
hg-offline-domain = { path = "backend/contexts/offline/domain" }
hg-offline-features = { path = "backend/contexts/offline/features" }
hg-runtime = { path = "backend/runtime" }
hg-viewing-domain = { path = "backend/contexts/viewing/domain" }
hg-viewing-features = { path = "backend/contexts/viewing/features" }
hkdf = { version = "0.13", default-features = false }
http-body-util = { version = "0.1", default-features = false }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "http1"] }
libc = "0.2"
nsh-base = { version = "0.6.1", default-features = false }
nsh-core = { version = "0.6.1", default-features = false }
nsh-engine = { version = "0.6.1", default-features = false }
nsh-platform-macos = { version = "0.6.1", default-features = false }
nsh-platform-windows = { version = "0.6.1", default-features = false }
nsh-testing = { version = "0.6.1", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["ecdh", "arithmetic", "getrandom"] }
parking_lot = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "gzip"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = { version = "3", default-features = false }
thiserror = { version = "2", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
url = { version = "2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
let_underscore_drop = "deny"

[workspace.lints.clippy]
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"

unwrap_used = "forbid"
todo = "forbid"
unimplemented = "forbid"
dbg_macro = "forbid"
let_underscore_must_use = "forbid"
let_underscore_future = "forbid"
panic_in_result_fn = "forbid"
fallible_impl_from = "forbid"

await_holding_lock = "forbid"
await_holding_refcell_ref = "forbid"

expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
wildcard_enum_match_arm = "deny"
large_futures = "deny"
print_stdout = "deny"
print_stderr = "deny"

disallowed_types = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"
disallowed_fields = "deny"
disallowed_names = "deny"

cognitive_complexity = "deny"
too_many_lines = "deny"
needless_pass_by_value = "deny"
cloned_instead_of_copied = "deny"
clone_on_ref_ptr = "deny"
mod_module_files = "forbid"
tests_outside_test_module = "forbid"
inline_modules = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
