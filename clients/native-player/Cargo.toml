[package]
name = "hg-native-player"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
nsh-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
libc.workspace = true
nsh-platform-macos.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows.workspace = true

[lints.rust]
unsafe_code = "deny"
let_underscore_drop = "deny"

[lints.clippy]
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"
unwrap_used = "forbid"
todo = "forbid"
unimplemented = "forbid"
dbg_macro = "forbid"
let_underscore_must_use = "forbid"
let_underscore_future = "forbid"
panic_in_result_fn = "forbid"
fallible_impl_from = "forbid"
await_holding_lock = "forbid"
await_holding_refcell_ref = "forbid"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
wildcard_enum_match_arm = "deny"
large_futures = "deny"
print_stdout = "deny"
print_stderr = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"
disallowed_fields = "deny"
disallowed_names = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
needless_pass_by_value = "deny"
cloned_instead_of_copied = "deny"
clone_on_ref_ptr = "deny"
mod_module_files = "forbid"
tests_outside_test_module = "forbid"
inline_modules = "deny"
