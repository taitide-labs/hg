[package]
name = "hg-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
env_logger = "0.11"
hg-contracts = { path = "../../contracts" }
hg-gateway = { path = "../gateway" }
nsh-base = { version = "0.6.1", default-features = false }
nsh-core = "0.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.6.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.6.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.6.1", default-features = false }

[dev-dependencies]
nsh-engine = { version = "0.6.1", default-features = false }
nsh-testing = { version = "0.6.1", default-features = false }

[lints]
workspace = true
