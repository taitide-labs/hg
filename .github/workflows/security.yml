# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Scheduled Security

on:
  schedule:
    - cron: "30 23 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-security
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL Deep Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read # Read workflow run metadata for CodeQL
      contents: read
      security-events: write # Upload SARIF analysis results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        run: rustup install --profile minimal
      - uses: github/codeql-action/init@52cf1852265d99e9bea071b03366fc777a602909 # codeql-bundle-v2.27.4
        with:
          languages: rust
          build-mode: none
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@52cf1852265d99e9bea071b03366fc777a602909 # codeql-bundle-v2.27.4

  cargo-deny:
    name: Weekly Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install: false
          cache_save: false
      - name: Install cargo-deny
        run: mise install --locked cargo-deny
      - name: Run cargo-deny
        env:
          RUSTUP_TOOLCHAIN: stable
        run: mise run audit

  zizmor:
    name: Workflow Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # Upload workflow audit SARIF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1

  mutants:
    name: Weekly Mutation Testing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        run: rustup install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: mutants
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-mutants,cargo-nextest
      - name: Run mutation tests on contracts and domain crates
        run: |
          mapfile -t pkgs < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.workspace_root as $root
              | .packages[]
              | select(
                  (.manifest_path | gsub("\\\\"; "/") | endswith("/domain/Cargo.toml"))
                  or (.manifest_path | gsub("\\\\"; "/") == ($root | gsub("\\\\"; "/")) + "/contracts/Cargo.toml")
                )
              | ("-p", .name)')
          test "${#pkgs[@]}" -gt 0
          cargo mutants --in-place "${pkgs[@]}"
