# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-main
  queue: max

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Create release tags and draft releases
      pull-requests: write # Create and update release PRs
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  test-app:
    name: Test Release App (${{ matrix.name }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
          - name: windows-x86_64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        id: rustup
        shell: bash
        background: true
        env:
          TARGET: ${{ matrix.rust_target }}
        run: rustup install --profile minimal && rustup target add "$TARGET"
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install: false
          cache_save: false
      - name: Install test runner
        shell: bash
        run: mise install --locked "github:nextest-rs/nextest"
      - name: Wait for Rust toolchain
        wait: rustup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test-${{ matrix.rust_target }}
      - name: Run cross-platform checks
        shell: bash
        env:
          TARGET: ${{ matrix.rust_target }}
        run: |
          cargo clippy -q --workspace --all-targets --locked --target "$TARGET" -- -D warnings
          mise x -- cargo nextest run --workspace --locked --target "$TARGET" --no-tests=pass --cargo-quiet --status-level=slow --final-status-level=slow --show-progress=none

  build-app:
    name: Build Release App (${{ matrix.name }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            nsh_target: macos
            nsh_args: "--arch arm64"
            ext: tar.gz
          - name: windows-x86_64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            nsh_target: windows
            nsh_args: ""
            ext: zip
          - name: android-arm64
            runner: ubuntu-24.04
            rust_target: aarch64-linux-android
            nsh_target: android
            nsh_args: "--abi arm64-v8a"
            ext: apk
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux native build tools
        if: ${{ startsWith(matrix.runner, 'ubuntu-') }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang llvm
      - name: Setup Rust toolchain
        id: rustup
        shell: bash
        background: true
        env:
          TARGET: ${{ matrix.rust_target }}
        run: rustup install --profile minimal && rustup target add "$TARGET"
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install: false
          cache_save: false
      - name: Install release tools
        shell: bash
        run: mise install --locked "github:longbridge/nsh"
      - name: Wait for Rust toolchain
        wait: rustup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: pkg-${{ matrix.rust_target }}
      - name: Install Windows libmpv runtime
        if: ${{ matrix.nsh_target == 'windows' }}
        shell: bash
        env:
          MPV_URL: "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-dev-x86_64-20261111-git-bcde6b93cc.7z"
          MPV_SHA256: "273c079b11ea5575822f972756f4c9a71149a5c10130353abeb8586738938452"
        run: |
          set -euo pipefail
          runner_temp_unix=$(cygpath -u "$RUNNER_TEMP")
          mpv_archive="${runner_temp_unix}/mpv-dev.7z"
          mpv_extract="${runner_temp_unix}/mpv-dev"
          curl -fsSL -o "$mpv_archive" "$MPV_URL"
          printf '%s  %s\n' "$MPV_SHA256" "$mpv_archive" | sha256sum -c -
          rm -rf "$mpv_extract"
          7z x -y -bd "$mpv_archive" "-o${mpv_extract}"
          libmpv_dll=$(find "$mpv_extract" -type f -name 'libmpv-2.dll' | head -n 1)
          test -s "$libmpv_dll"
          mkdir -p "${runner_temp_unix}/win-runtime"
          cp "$libmpv_dll" "${runner_temp_unix}/win-runtime/libmpv-2.dll"
      - name: Package client artifact
        shell: bash
        env:
          PKG_LABEL: ${{ matrix.name }}
          NSH_TARGET: ${{ matrix.nsh_target }}
          NSH_ARGS: ${{ matrix.nsh_args }}
          EXT: ${{ matrix.ext }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          app_pkg=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.manifest_path | gsub("\\\\"; "/") | endswith("/clients/app/Cargo.toml")) | .name' \
            | tr -d '\r')
          test -n "$app_pkg"
          rm -rf out_tmp dist
          mkdir -p out_tmp dist
          read -ra extra_args <<< "$NSH_ARGS"
          if [ "$NSH_TARGET" = "android" ] && [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            keystore_path="${RUNNER_TEMP}/release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
            trap 'rm -f "$keystore_path"' EXIT
            extra_args+=(--keystore "$keystore_path" --key-alias "$ANDROID_KEY_ALIAS")
          fi
          mise x -- nsh package clients/app \
            --target "$NSH_TARGET" \
            --app-version "${TAG#v}" \
            "${extra_args[@]}" \
            -o out_tmp
          case "$EXT" in
            apk)
              apk_file=$(find out_tmp -maxdepth 2 -type f -name '*.apk' | head -n 1)
              test -n "$apk_file"
              cp "$apk_file" "dist/${app_pkg}-${PKG_LABEL}.apk"
              ;;
            zip)
              runner_temp_unix=$(cygpath -u "$RUNNER_TEMP")
              app_dir=$(find out_tmp -mindepth 1 -maxdepth 1 -type d | head -n 1)
              if [ -n "$app_dir" ]; then
                exe_file=$(find "$app_dir" -maxdepth 2 -type f -name '*.exe' | head -n 1)
                test -n "$exe_file"
                cp "${runner_temp_unix}/win-runtime/libmpv-2.dll" "$(dirname "$exe_file")/libmpv-2.dll"
                7z a -bd "dist/${app_pkg}-${PKG_LABEL}.zip" "./${app_dir}"
              else
                zip_file=$(find out_tmp -maxdepth 1 -type f -name '*.zip' | head -n 1)
                test -n "$zip_file"
                rm -rf out_stage
                mkdir -p out_stage
                unzip -q -o "$zip_file" -d out_stage
                exe_file=$(find out_stage -type f -name '*.exe' | head -n 1)
                test -n "$exe_file"
                cp "${runner_temp_unix}/win-runtime/libmpv-2.dll" "$(dirname "$exe_file")/libmpv-2.dll"
                (cd out_stage && 7z a -bd "../dist/${app_pkg}-${PKG_LABEL}.zip" .)
              fi
              ;;
            *)
              tar_file=$(find out_tmp -maxdepth 1 -type f -name '*.tar.gz' | head -n 1)
              if [ -n "$tar_file" ]; then
                cp "$tar_file" "dist/${app_pkg}-${PKG_LABEL}.tar.gz"
              else
                tar -C out_tmp -czf "dist/${app_pkg}-${PKG_LABEL}.tar.gz" .
              fi
              ;;
          esac
          test -n "$(find dist -maxdepth 1 -type f)"
      - name: Verify Windows package and libmpv runtime
        if: ${{ matrix.nsh_target == 'windows' }}
        shell: bash
        env:
          TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          runner_temp_unix=$(cygpath -u "$RUNNER_TEMP")
          verify_dir="${runner_temp_unix}/verify-win"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          zip_artifact=$(find dist -maxdepth 1 -type f -name '*.zip' | head -n 1)
          test -n "$zip_artifact"
          unzip -q -o "$zip_artifact" -d "$verify_dir"
          verify_exe=$(find "$verify_dir" -type f -name '*.exe' | head -n 1)
          test -n "$verify_exe"
          dll_dir=$(dirname "$verify_exe")
          test -s "${dll_dir}/libmpv-2.dll"
          PATH="${dll_dir}:$PATH" cargo test -p hg-native-player --lib --locked --target "$TARGET" -- --ignored --exact windows::tests::windows_libmpv_runtime_smoke_loads_and_creates_engine
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-app-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  upload-assets:
    name: Upload & Attest Release Assets
    needs: [release-please, test-app, build-app]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Upload release assets and publish release
      id-token: write # Mint OIDC token for SLSA attestation
      attestations: write # Persist build provenance attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*
            !artifacts/SHA256SUMS.txt
      - name: Upload release assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" artifacts/* --clobber
          gh release edit "$TAG" --draft=false
