# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-main
  queue: max

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Create release tags and draft releases
      pull-requests: write # Create and update release PRs
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  build-app:
    name: Build Release App (${{ matrix.name }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            nsh_target: macos
            nsh_args: "--arch arm64"
            ext: tar.gz
            run_tests: true
          - name: windows-x86_64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            nsh_target: windows
            nsh_args: ""
            ext: zip
            run_tests: true
          - name: android-arm64
            runner: ubuntu-24.04
            rust_target: aarch64-linux-android
            nsh_target: android
            nsh_args: "--abi arm64-v8a"
            ext: apk
            run_tests: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux native build tools
        if: ${{ startsWith(matrix.runner, 'ubuntu-') }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang llvm
      - name: Setup Rust toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.rust_target }}
        run: rustup install --profile minimal && rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.rust_target }}
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install: false
          cache_save: false
      - name: Install release tools
        shell: bash
        env:
          RUN_TESTS: ${{ matrix.run_tests }}
        run: |
          mise install --locked "github:longbridge/nsh"
          if [ "$RUN_TESTS" = "true" ]; then
            mise install --locked "github:nextest-rs/nextest"
          fi
      - name: Run cross-platform tests
        if: ${{ matrix.run_tests }}
        shell: bash
        env:
          TARGET: ${{ matrix.rust_target }}
        run: mise x -- cargo nextest run --workspace --locked --target "$TARGET" --no-tests=pass --cargo-quiet --status-level=fail --final-status-level=fail --show-progress=none
      - name: Package client artifact
        shell: bash
        env:
          PKG_LABEL: ${{ matrix.name }}
          NSH_TARGET: ${{ matrix.nsh_target }}
          NSH_ARGS: ${{ matrix.nsh_args }}
          EXT: ${{ matrix.ext }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          app_pkg=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.manifest_path | gsub("\\\\"; "/") | endswith("/clients/app/Cargo.toml")) | .name' \
            | tr -d '\r')
          test -n "$app_pkg"
          mkdir -p out_tmp dist
          read -ra extra_args <<< "$NSH_ARGS"
          if [ "$NSH_TARGET" = "android" ] && [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            keystore_path="${RUNNER_TEMP}/release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
            trap 'rm -f "$keystore_path"' EXIT
            extra_args+=(--keystore "$keystore_path" --key-alias "$ANDROID_KEY_ALIAS")
          fi
          mise x -- nsh package clients/app \
            --target "$NSH_TARGET" \
            --app-version "${TAG#v}" \
            "${extra_args[@]}" \
            -o out_tmp
          case "$EXT" in
            apk)
              apk_file=$(find out_tmp -maxdepth 2 -type f -name '*.apk' | head -n 1)
              test -n "$apk_file"
              cp "$apk_file" "dist/${app_pkg}-${PKG_LABEL}.apk"
              ;;
            zip)
              zip_file=$(find out_tmp -maxdepth 1 -type f -name '*.zip' | head -n 1)
              if [ -n "$zip_file" ]; then
                cp "$zip_file" "dist/${app_pkg}-${PKG_LABEL}.zip"
              else
                7z a "dist/${app_pkg}-${PKG_LABEL}.zip" ./out_tmp/*
              fi
              ;;
            *)
              tar_file=$(find out_tmp -maxdepth 1 -type f -name '*.tar.gz' | head -n 1)
              if [ -n "$tar_file" ]; then
                cp "$tar_file" "dist/${app_pkg}-${PKG_LABEL}.tar.gz"
              else
                tar -C out_tmp -czf "dist/${app_pkg}-${PKG_LABEL}.tar.gz" .
              fi
              ;;
          esac
          test -n "$(find dist -maxdepth 1 -type f)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-app-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  upload-assets:
    name: Upload & Attest Release Assets
    needs: [release-please, build-app]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Upload release assets and publish release
      id-token: write # Mint OIDC token for SLSA attestation
      attestations: write # Persist build provenance attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*
            !artifacts/SHA256SUMS.txt
      - name: Upload release assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" artifacts/* --clobber
          gh release edit "$TAG" --draft=false
